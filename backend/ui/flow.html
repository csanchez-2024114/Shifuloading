<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shifu · prueba de UI actions con React Flow</title>
<!--
  Prueba de concepto (solo local, SHIFU_DEV_UI=1): un frontend React que EJECUTA las ui_actions que manda el agente.
  Sin instalacion ni compilacion: React y React Flow vienen por CDN. Abrir http://localhost:5001/ui/flow.html

  Contrato que implementa (evento "done" del chat, campo ui_actions):
    connect_app      -> boton de conectar (aqui: conexion simulada)
    ui_action        -> boton con `label`; al pulsarlo se ejecuta HANDLERS[id] (catalogo en Mongo: ui_actions_catalog).
                        Este cliente le declara al agente lo que sabe pintar: ui_supported = las llaves de HANDLERS.
    render_workflow  -> el workflow se dibuja como grafo en React Flow (un nodo por paso)
    open_trigger     -> nodo de disparador al inicio del grafo
  Para soportar una accion nueva del catalogo: una entrada en HANDLERS. Lo demas no cambia.
-->
<link rel="stylesheet" href="https://unpkg.com/reactflow@11.11.4/dist/style.css">
<style>
  :root { --bg:#f6f7f9; --card:#fff; --ink:#1c2330; --mute:#6b7585; --line:#dfe3ea; --accent:#3b6cf6; --ok:#12805c; --warn:#b45309; }
  @media (prefers-color-scheme: dark) { :root { --bg:#12151b; --card:#1b2029; --ink:#e7ebf2; --mute:#98a2b3; --line:#2c3340; --accent:#7ea2ff; --ok:#4ade80; --warn:#fbbf24; } }
  * { box-sizing: border-box; }
  body { margin:0; font:14px/1.45 system-ui, sans-serif; background:var(--bg); color:var(--ink); }
  .app { display:grid; grid-template-columns: minmax(320px, 420px) 1fr; height:100vh; }
  @media (max-width: 820px) { .app { grid-template-columns: 1fr; grid-template-rows: 55vh 45vh; } }
  .chat { display:flex; flex-direction:column; border-right:1px solid var(--line); min-height:0; }
  .head { padding:10px 14px; border-bottom:1px solid var(--line); display:flex; gap:8px; align-items:center; justify-content:space-between; }
  .head b { font-size:15px; } .head small { color:var(--mute); }
  .msgs { flex:1; overflow:auto; padding:14px; display:flex; flex-direction:column; gap:10px; }
  .m { max-width:92%; padding:9px 12px; border-radius:12px; white-space:pre-wrap; background:var(--card); border:1px solid var(--line); }
  .m.user { align-self:flex-end; background:var(--accent); color:#fff; border-color:transparent; }
  .acts { display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
  button { font:inherit; padding:6px 11px; border-radius:8px; border:1px solid var(--line); background:var(--card); color:var(--ink); cursor:pointer; }
  button.pri { background:var(--accent); color:#fff; border-color:transparent; } button:disabled { opacity:.5; cursor:default; }
  .status { color:var(--mute); font-size:12px; padding:0 14px 6px; min-height:20px; }
  form.send { display:flex; gap:8px; padding:10px 14px; border-top:1px solid var(--line); }
  input { flex:1; font:inherit; padding:8px 10px; border-radius:8px; border:1px solid var(--line); background:var(--card); color:var(--ink); min-width:0; }
  .side { display:flex; flex-direction:column; min-height:0; }
  .tabs { display:flex; gap:4px; padding:8px 12px; border-bottom:1px solid var(--line); }
  .tabs button.on { border-color:var(--accent); color:var(--accent); }
  .pane { flex:1; min-height:0; position:relative; }
  .panel { padding:16px; overflow:auto; height:100%; }
  .panel h3 { margin:0 0 4px; } .panel p { color:var(--mute); margin:0 0 12px; }
  .row { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:9px 12px; margin-bottom:8px; overflow-wrap:anywhere; }
  .row small { color:var(--mute); display:block; }
  .empty { color:var(--mute); display:grid; place-items:center; height:100%; text-align:center; padding:24px; }
  .node { background:var(--card); color:var(--ink); border:1px solid var(--line); border-radius:10px; padding:9px 12px; width:250px; font-size:12px; text-align:left; }
  .node b { display:block; font-size:13px; margin-bottom:2px; } .node small { color:var(--mute); overflow-wrap:anywhere; display:block; }
  .node.trigger { border-color:var(--warn); } .node .tag { display:block; color:var(--accent); font-weight:600; text-transform:uppercase; font-size:10px; letter-spacing:.04em; }
  .login { max-width:340px; margin:14vh auto; display:grid; gap:8px; padding:20px; background:var(--card); border:1px solid var(--line); border-radius:12px; }
  .err { color:#dc2626; font-size:12px; }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/reactflow@11.11.4/dist/umd/index.js"></script>
<script>
const { useState, useRef, useEffect, useCallback, createElement: h } = React;
const RF = window.ReactFlow, Flow = RF.default || RF.ReactFlow;
const API = "/api/v1";
const newId = () => crypto.randomUUID().replace(/-/g, "");

async function api(path, init = {}) {
  const r = await fetch(API + path, { ...init, headers: { "Content-Type": "application/json", ...(init.headers || {}), Authorization: `Bearer ${localStorage.getItem("shifu_token")}` } });
  if (!r.ok) throw new Error(`${path}: HTTP ${r.status}`);
  return r.json();
}

// ── Lo que este frontend sabe hacer con cada accion del catalogo. Accion nueva en Mongo = una entrada aqui. ──────────
const list = (rows, fmt) => rows.length ? rows.map(fmt) : [["(nada todavía)", ""]];
const HANDLERS = {
  open_memory:        { title: "Lo que Shifu recuerda", load: async () => list((await api("/me/memories")).memories.filter(m => m.status === "active"), m => [m.value, m.key]) },
  open_notifications: { title: "Mis avisos", load: async () => list((await api("/me/notifications?limit=20")).notifications, n => [n.message, n.type]) },
  open_connections:   { title: "Mis apps conectadas", load: async () => { const j = await api("/me/integrations"); const rows = j.integrations || j.accounts || j; return list(Array.isArray(rows) ? rows : [], a => [a.app || a.provider || a.name || JSON.stringify(a), a.email || a.account_id || a.status || ""]); } },
  open_settings:      { title: "Ajustes", load: async () => Object.entries(await api("/me/preferences")).map(([k, v]) => [typeof v === "object" ? JSON.stringify(v) : String(v), k]) },
  open_billing:       { title: "Mi plan y consumo", load: async () => Object.entries(await api("/me/usage")).map(([k, v]) => [typeof v === "object" ? JSON.stringify(v) : String(v), k]) },
  open_workflows:     { title: "Mis workflows", tab: "flow" },      // en esta prueba: el grafo del ultimo workflow creado en la conversacion
  new_conversation:   { title: "Conversación nueva", run: (ctx) => ctx.reset() },
};

function toGraph(wf) {
  // Un nodo por paso, en columna; el disparador (open_trigger) va primero. Una arista punteada extra cuando un paso usa el
  // resultado de otro que no es el inmediato anterior ({{step_N...}} en su configuracion).
  const nodes = [], edges = [];
  const add = (id, y, cls, body) => nodes.push({ id, position: { x: 0, y }, data: { label: body }, className: "node " + cls, style: { width: 250 } });
  let y = 0;
  if (wf.trigger) { add("trigger", y, "trigger", h("div", null, h("span", { className: "tag" }, "disparador · " + wf.trigger.trigger_type), h("b", null, wf.trigger.summary || "Manual"), wf.trigger.webhook_url && h("small", null, wf.trigger.webhook_url))); y += 110; }
  (wf.steps || []).forEach((s, i) => {
    const id = "step_" + (s.order || i + 1), cfg = Object.entries(s.config || {}).filter(([k]) => k !== "nodeType");
    add(id, y, "", h("div", null, h("span", { className: "tag" }, (s.app || "").replace(/_/g, " ")), h("b", null, `${s.order || i + 1}. ${s.name || s.function_id}`), h("small", null, s.function_id), cfg.slice(0, 3).map(([k, v]) => h("small", { key: k }, `${k}: ${typeof v === "string" ? v : JSON.stringify(v)}`))));
    const prev = i === 0 ? (wf.trigger ? "trigger" : null) : "step_" + (wf.steps[i - 1].order || i);
    if (prev) edges.push({ id: `${prev}-${id}`, source: prev, target: id, animated: i === 0 && !!wf.trigger });
    for (const m of JSON.stringify(s.config || {}).matchAll(/\{\{step_(\d+)/g)) { const src = "step_" + m[1]; if (src !== prev && !edges.some(e => e.id === `${src}~${id}`)) edges.push({ id: `${src}~${id}`, source: src, target: id, style: { strokeDasharray: "4 3" }, label: "usa su resultado" }); }
    y += 150;
  });
  return { nodes, edges };
}

function Login({ onDone }) {
  const [email, setEmail] = useState(""), [pass, setPass] = useState(""), [err, setErr] = useState("");
  const go = async (register) => {
    setErr("");
    const r = await fetch(`${API}/auth/${register ? "register" : "login"}`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(register ? { name: "Demo", last_name: "Flow", email, password: pass } : { email, password: pass }) });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) return setErr(j.detail ? (typeof j.detail === "string" ? j.detail : JSON.stringify(j.detail)) : `HTTP ${r.status}`);
    localStorage.setItem("shifu_token", j.access_token); localStorage.setItem("shifu_refresh", j.refresh_token); onDone();
  };
  return h("div", { className: "login" }, h("b", null, "Shifu · prueba de UI actions"), h("input", { placeholder: "correo", value: email, onChange: e => setEmail(e.target.value) }), h("input", { placeholder: "contraseña (8+)", type: "password", value: pass, onChange: e => setPass(e.target.value) }),
    h("div", { className: "acts" }, h("button", { className: "pri", onClick: () => go(false) }, "Entrar"), h("button", { onClick: () => go(true) }, "Crear cuenta")), err && h("div", { className: "err" }, err));
}

function App() {
  const [logged, setLogged] = useState(!!localStorage.getItem("shifu_token"));
  const [msgs, setMsgs] = useState([]), [text, setText] = useState(""), [busy, setBusy] = useState(false), [status, setStatus] = useState("");
  const [tab, setTab] = useState("flow"), [wf, setWf] = useState(null), [panel, setPanel] = useState(null);
  const conv = useRef(newId()), end = useRef(null);
  useEffect(() => { end.current?.scrollIntoView({ behavior: "smooth" }); }, [msgs, status]);

  const send = useCallback(async (userText, silent = false) => {
    if (!userText.trim() || busy) return;
    setBusy(true); setStatus("pensando…");
    if (!silent) setMsgs(m => [...m, { role: "user", text: userText }]);
    try {
      const r = await fetch(`${API}/chat/stream`, { method: "POST", headers: { "Content-Type": "application/json", Authorization: `Bearer ${localStorage.getItem("shifu_token")}` }, body: JSON.stringify({ text: userText, conversation_id: conv.current, hold: true, silent, ui_supported: Object.keys(HANDLERS) }) });
      if (r.status === 401) { localStorage.removeItem("shifu_token"); setLogged(false); return; }
      if (!r.ok) throw new Error(`el chat respondió HTTP ${r.status}`);
      const reader = r.body.getReader(), dec = new TextDecoder(); let buf = "";
      for (;;) {
        const { done, value } = await reader.read(); if (done) break;
        buf += dec.decode(value, { stream: true });
        const lines = buf.split("\n"); buf = lines.pop();
        for (const line of lines) {
          if (!line.startsWith("data: ")) continue;
          const ev = JSON.parse(line.slice(6));
          if (ev.type === "agent_status") setStatus(ev.label || ev.node);
          else if (ev.type === "error") setMsgs(m => [...m, { role: "agent", text: "Error: " + ev.message, actions: [] }]);
          else if (ev.type === "done") {
            const actions = ev.ui_actions || [];
            setMsgs(m => [...m, { role: "agent", text: ev.text, actions }]);
            // Acciones que el SISTEMA decide: se ejecutan solas al llegar (nadie tiene que pulsar nada).
            const card = actions.find(a => a.type === "render_workflow");
            if (card) { setWf({ id: card.workflow_id, steps: card.steps, trigger: actions.find(a => a.type === "open_trigger") }); setTab("flow"); }
          }
        }
      }
    } catch (e) { setMsgs(m => [...m, { role: "agent", text: "Error: " + e.message, actions: [] }]); }
    finally { setBusy(false); setStatus(""); }
  }, [busy]);

  // Acciones que el USUARIO pidio: llegan como boton y se ejecutan al pulsarlo.
  const run = async (a) => {
    // Contrato: una accion con confirm=true cambia algo y NO se ejecuta sin que el usuario lo confirme en el propio boton.
    if (a.confirm && !window.confirm(`¿Seguro que quieres: ${a.label}?`)) return;
    const hnd = HANDLERS[a.id];
    if (!hnd) return (setPanel({ title: a.label, rows: [[`Este frontend todavía no implementa «${a.id}».`, "Está en el catálogo de Mongo; falta su entrada en HANDLERS."]] }), setTab("panel"));
    if (hnd.run) return hnd.run({ reset: () => { conv.current = newId(); setMsgs([]); setWf(null); setPanel(null); } });
    if (hnd.tab) return setTab(hnd.tab);
    setPanel({ title: hnd.title, rows: [["cargando…", ""]] }); setTab("panel");
    try { setPanel({ title: hnd.title, rows: await hnd.load(a.params || {}) }); } catch (e) { setPanel({ title: hnd.title, rows: [[e.message, "error"]] }); }
  };
  const connect = async (a) => { await api(`/dev/connect/${a.app}`, { method: "POST" }); send(`ya conecté ${a.app}`, true); };

  if (!logged) return h(Login, { onDone: () => setLogged(true) });
  const graph = wf ? toGraph(wf) : null;
  return h("div", { className: "app" },
    h("div", { className: "chat" },
      h("div", { className: "head" }, h("div", null, h("b", null, "Shifu"), " ", h("small", null, "UI actions + React Flow")), h("button", { onClick: () => { localStorage.removeItem("shifu_token"); conv.current = newId(); setMsgs([]); setWf(null); setPanel(null); setLogged(false); } }, "Salir")),
      h("div", { className: "msgs" },
        msgs.length === 0 && h("div", { className: "empty" }, "Prueba: «ábreme lo que recuerdas de mí», «enséñame mis avisos», o crea un workflow: «cada lunes a las 9 lee la hoja https://docs.google.com/spreadsheets/d/abc123/edit y mándame el total por Gmail a yo@ejemplo.com»."),
        msgs.map((m, i) => h("div", { key: i, className: "m " + m.role }, m.text,
          m.actions && m.actions.some(a => a.type === "connect_app" || a.type === "ui_action") && h("div", { className: "acts" }, m.actions.map((a, k) =>
            a.type === "connect_app" ? h("button", { key: k, className: "pri", onClick: e => { e.target.disabled = true; connect(a); } }, `Conectar ${a.app} (simulado)`)
            : a.type === "ui_action" ? h("button", { key: k, onClick: () => run(a) }, "▶ " + a.label + (a.params && a.params.app ? ` · ${a.params.app}` : "")) : null)))),
        h("div", { ref: end })),
      h("div", { className: "status" }, status),
      h("form", { className: "send", onSubmit: e => { e.preventDefault(); const t = text; setText(""); send(t); } },
        h("input", { value: text, onChange: e => setText(e.target.value), placeholder: "Escribe a Shifu…", disabled: busy }), h("button", { className: "pri", disabled: busy }, "Enviar"))),
    h("div", { className: "side" },
      h("div", { className: "tabs" }, h("button", { className: tab === "flow" ? "on" : "", onClick: () => setTab("flow") }, "Workflow"), h("button", { className: tab === "panel" ? "on" : "", onClick: () => setTab("panel") }, panel ? panel.title : "Panel")),
      h("div", { className: "pane" },
        tab === "flow"
          ? (graph ? h(Flow, { key: wf.id, nodes: graph.nodes, edges: graph.edges, fitView: true, nodesDraggable: true, proOptions: { hideAttribution: false } }, h(RF.Background, null), h(RF.Controls, null))
                   : h("div", { className: "empty" }, "Cuando el agente active un workflow, aquí aparece su grafo (acción render_workflow)."))
          : h("div", { className: "panel" }, panel ? [h("h3", { key: "t" }, panel.title), h("p", { key: "p" }, "Abierto por una ui_action del agente."), ...panel.rows.map((r, i) => h("div", { key: i, className: "row" }, r[0], r[1] && h("small", null, r[1])))]
                                                   : h("div", { className: "empty" }, "Pide abrir algo y pulsa el botón que aparece bajo la respuesta.")))));
}
ReactDOM.createRoot(document.getElementById("root")).render(h(App));
</script>
</body>
</html>
