<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Pagos</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #6479af;
            font-family: 'Arial', sans-serif;
        }
        .card {
            background-color: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            width: 90%;
            max-width: 500px;
            padding: 30px;
            text-align: center;
        }
        .logo {
            width: 120px;
            margin-bottom: 20px;
        }
        h1 {
            color: #333;
            font-size: 28px;
            margin-bottom: 15px;
        }
        p {
            color: #666;
            font-size: 16px;
            line-height: 1.5;
            margin-bottom: 25px;
        }
        .btn {
            display: inline-block;
            background-color: #6479af;
            color: white;
            padding: 12px 30px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: bold;
            transition: all 0.3s ease;
        }
        .btn:hover {
            background-color: #4e5e8a;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <div class="card">
        <img src="{{ url_for('static', filename='shifu.png') }}" alt="Shifu Logo" class="logo">
        <h1>{{ title }}</h1>
        <p>{{ message }}</p>
        {% if show_button %}
        <a href="https://hypershifu.com/chat" class="btn">{{ button_text }}</a>
        {% endif %}
    </div>
</body>
</html>
