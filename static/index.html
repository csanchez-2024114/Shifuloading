<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Agente 0</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%234f46e5'/%3E%3Ccircle cx='11' cy='16' r='2.5' fill='white'/%3E%3Ccircle cx='21' cy='16' r='2.5' fill='white'/%3E%3C/svg%3E">
<style>
:root {
  --bg: #f7f7f8;
  --surface: #ffffff;
  --surface-2: #f0f1f3;
  --text: #1c1d21;
  --muted: #5f6470;
  --border: #dcdee4;
  --accent: #4f46e5;
  --accent-text: #ffffff;
  --user-bg: #4f46e5;
  --user-text: #ffffff;
  --bot-bg: #ffffff;
  --code-bg: #f1f2f5;
  --ok: #17794b;
  --ok-bg: #e4f5ec;
  --err: #a12a2a;
  --err-bg: #fdeaea;
  --err-border: #f3c4c4;
  --warn-bg: #fff6df;
  --warn-border: #efd48a;
  --chip-bg: #eef0ff;
  --chip-text: #3730a3;
  --link: #3b3fd8;
  --shadow: 0 1px 2px rgba(0,0,0,.06);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #14151a;
    --surface: #1d1f26;
    --surface-2: #272a33;
    --text: #ececf1;
    --muted: #a0a5b3;
    --border: #353945;
    --accent: #7c83ff;
    --accent-text: #0f1020;
    --user-bg: #4a4fd6;
    --user-text: #ffffff;
    --bot-bg: #1d1f26;
    --code-bg: #12131a;
    --ok: #6fd9a2;
    --ok-bg: #16301f;
    --err: #ff9b9b;
    --err-bg: #3a1c1f;
    --err-border: #6b3036;
    --warn-bg: #3a3118;
    --warn-border: #6b5a22;
    --chip-bg: #262a4d;
    --chip-text: #c3c8ff;
    --link: #9aa0ff;
    --shadow: none;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  -webkit-text-size-adjust: 100%;
}
button, input, select, textarea { font: inherit; color: inherit; }
.app {
  display: flex; flex-direction: column;
  height: 100vh; height: 100dvh;
  max-width: 860px; margin: 0 auto;
  background: var(--bg);
}
/* header */
header {
  display: flex; align-items: center; gap: 8px;
  padding: 10px 12px; padding-top: max(10px, env(safe-area-inset-top));
  border-bottom: 1px solid var(--border);
  background: var(--surface);
}
header h1 { font-size: 1.05rem; margin: 0 4px 0 0; font-weight: 650; white-space: nowrap; }
.thread-wrap { flex: 1; min-width: 0; }
select#thread {
  width: 100%; min-width: 0; padding: 7px 8px;
  background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px;
  font-size: .92rem; text-overflow: ellipsis;
}
.tid { font-size: .7rem; color: var(--muted); margin-top: 2px; padding-left: 2px; font-variant-numeric: tabular-nums; }
#newbtn.queued { border-style: dashed; border-color: var(--accent); color: var(--accent); }
.btn {
  border: 1px solid var(--border); background: var(--surface-2);
  border-radius: 8px; padding: 7px 11px; cursor: pointer; font-size: .92rem;
  white-space: nowrap; line-height: 1.2; min-height: 36px;
}
.btn:hover:not(:disabled) { border-color: var(--accent); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); font-weight: 600; }
.btn.danger { color: var(--err); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
#settings {
  display: none; padding: 10px 12px; background: var(--surface-2);
  border-bottom: 1px solid var(--border);
}
#settings.open { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
#settings label { font-size: .9rem; color: var(--muted); }
#settings input {
  padding: 7px 9px; border: 1px solid var(--border); border-radius: 8px;
  background: var(--surface); min-width: 0; flex: 1 1 160px; max-width: 280px;
}
#settings small { color: var(--muted); flex-basis: 100%; }
#memories {
  display: none; padding: 10px 12px; background: var(--surface-2);
  border-bottom: 1px solid var(--border); max-height: 45vh; overflow-y: auto;
}
#memories.open { display: block; }
#memories h2 { font-size: .95rem; margin: 0 0 8px; }
#memories ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
#memories li { display: flex; gap: 10px; align-items: flex-start; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 8px 10px; }
#memories li .mtext { flex: 1; min-width: 0; overflow-wrap: anywhere; }
#memories li .mmeta { display: block; color: var(--muted); font-size: .8rem; margin-top: 3px; }
#memories li .mmeta q { font-style: italic; }
#memories li .btn { padding: 4px 9px; flex-shrink: 0; }
#memories .sys { text-align: left; }
.conf { font-weight: 600; }
.conf.verified { color: var(--ok); }
.conf.unverified { color: var(--err); }
.vnote { margin: 8px 0 0; font-size: .82rem; color: var(--muted); }
/* tiempos de respuesta (interruptor en Ajustes) */
.row.assistant { flex-direction: column; align-items: flex-start; }
.timing { margin: 3px 0 0 6px; font-size: .75rem; color: var(--muted); cursor: pointer; user-select: none; font-variant-numeric: tabular-nums; }
.timing .tdetail { display: none; margin-left: 6px; }
.math { font-family: "Cambria Math", "STIX Two Math", "Latin Modern Math", Georgia, serif; white-space: nowrap; }
.math.block { display: block; text-align: center; margin: 6px 0; white-space: normal; }
#settings select { padding: 7px 9px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); color: inherit; }
.timing.open .tdetail { display: inline; }
body.no-times .timing { display: none; }
#settings .switch { display: inline-flex; align-items: center; gap: 6px; font-size: .9rem; color: var(--muted); }
#settings .switch input { flex: none; min-width: 0; padding: 0; }
.vnote.corrected { color: var(--err); }
.vnote details { margin-top: 4px; }
.vnote summary { cursor: pointer; text-decoration: underline; }
.vnote .orig { margin-top: 6px; padding: 8px 10px; border-left: 3px solid var(--border); color: var(--text); opacity: .8; }
/* messages */
#messages {
  flex: 1; overflow-y: auto; padding: 16px 12px 8px;
  display: flex; flex-direction: column; gap: 14px;
  scroll-behavior: auto; overscroll-behavior: contain;
}
.row { display: flex; }
.row.user { justify-content: flex-end; }
.bubble {
  max-width: min(88%, 680px); padding: 10px 14px; border-radius: 16px;
  overflow-wrap: anywhere; box-shadow: var(--shadow);
}
.row.user .bubble { background: var(--user-bg); color: var(--user-text); border-bottom-right-radius: 5px; white-space: pre-wrap; }
.row.assistant .bubble { background: var(--bot-bg); border: 1px solid var(--border); border-bottom-left-radius: 5px; min-width: 56px; }
.row.assistant .bubble.err { background: var(--err-bg); border-color: var(--err-border); }
.toolline { align-self: flex-start; color: var(--muted); font-size: .82rem; padding-left: 6px; }
.toolline::before { content: "\2699\FE0E  "; }
.sys { align-self: center; color: var(--muted); font-size: .85rem; text-align: center; }
/* markdown */
.seg > :first-child { margin-top: 0; }
.seg > :last-child { margin-bottom: 0; }
.seg p { margin: .55em 0; }
.seg h1, .seg h2, .seg h3, .seg h4, .seg h5, .seg h6 { margin: .9em 0 .4em; line-height: 1.25; }
.seg h1 { font-size: 1.3rem; } .seg h2 { font-size: 1.18rem; } .seg h3 { font-size: 1.08rem; }
.seg h4, .seg h5, .seg h6 { font-size: 1rem; }
.seg ul, .seg ol { margin: .5em 0; padding-left: 1.5em; }
.seg li { margin: .2em 0; }
.seg code { background: var(--code-bg); padding: .12em .38em; border-radius: 5px; font: .88em ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
.seg pre { background: var(--code-bg); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; overflow-x: auto; margin: .7em 0; }
.seg pre code { background: none; padding: 0; font-size: .85rem; white-space: pre; }
.seg a { color: var(--link); }
.seg blockquote { margin: .6em 0; padding: .1em .9em; border-left: 3px solid var(--border); color: var(--muted); }
.seg .tbl { overflow-x: auto; margin: .6em 0; }
.seg table { border-collapse: collapse; font-size: .92em; }
.seg th, .seg td { border: 1px solid var(--border); padding: .35em .6em; text-align: left; vertical-align: top; }
.seg th { background: var(--border); white-space: nowrap; }
.seg th, .seg td { overflow-wrap: normal; word-break: normal; }
.seg hr { border: 0; border-top: 1px solid var(--border); margin: .9em 0; }
.caret { display: inline-block; width: .55em; height: 1em; vertical-align: text-bottom; background: var(--muted); margin-left: 2px; border-radius: 2px; animation: blink 1s steps(2, start) infinite; }
@keyframes blink { to { visibility: hidden; } }
.dots { display: inline-flex; gap: 4px; padding: 4px 0; }
.dots i { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); animation: bounce 1.2s infinite ease-in-out; }
.dots i:nth-child(2) { animation-delay: .15s; } .dots i:nth-child(3) { animation-delay: .3s; }
@keyframes bounce { 0%, 80%, 100% { opacity: .3; transform: none; } 40% { opacity: 1; transform: translateY(-3px); } }
/* chips */
.chip {
  display: inline-flex; align-items: center; gap: 6px; flex-wrap: wrap;
  margin: 6px 6px 6px 0; padding: 4px 10px; border-radius: 999px; font-size: .85rem;
  background: var(--chip-bg); color: var(--chip-text);
}
.chip .state { font-weight: 700; }
.chip .eng { opacity: .8; font-size: .8rem; }
.chip.running .spin { width: 11px; height: 11px; border-radius: 50%; border: 2px solid currentColor; border-right-color: transparent; animation: spin .8s linear infinite; }
.chip.done { background: var(--ok-bg); color: var(--ok); }
.chip.error { background: var(--err-bg); color: var(--err); border: 1px solid var(--err-border); }
.chip.skipped { background: var(--surface-2); color: var(--muted); border: 1px dashed var(--border); }
.toolline.skipped { font-style: italic; }
@keyframes spin { to { transform: rotate(360deg); } }
.errmsg { color: var(--err); margin: .4em 0 0; }
/* approval */
.approval { margin: 8px 0 2px; padding: 12px; border: 1px solid var(--warn-border); background: var(--warn-bg); border-radius: 12px; }
.approval h3 { margin: 0 0 6px; font-size: .98rem; }
.approval .act { margin: 8px 0; }
.approval .act b { font-family: ui-monospace, Menlo, Consolas, monospace; }
.approval .act p { margin: 2px 0 6px; color: var(--muted); font-size: .92rem; }
.approval pre { margin: 0; background: var(--code-bg); border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; overflow-x: auto; font: .82rem ui-monospace, Menlo, Consolas, monospace; white-space: pre-wrap; overflow-wrap: anywhere; }
.approval .btns { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
.approval .result { margin-top: 8px; font-weight: 600; font-size: .92rem; }
/* empty state */
.empty { margin: auto; text-align: center; color: var(--muted); max-width: 420px; padding: 20px; }
.empty h2 { color: var(--text); margin: 0 0 6px; font-size: 1.3rem; }
.suggest { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 14px; }
.suggest button { border: 1px solid var(--border); background: var(--surface); border-radius: 999px; padding: 7px 13px; cursor: pointer; font-size: .9rem; }
.suggest button:hover { border-color: var(--accent); }
/* composer */
form#composer {
  display: flex; gap: 8px; align-items: flex-end;
  padding: 10px 12px; padding-bottom: max(10px, env(safe-area-inset-bottom));
  background: var(--bg); border-top: 1px solid var(--border);
}
textarea#input {
  flex: 1; resize: none; max-height: 200px; min-height: 44px; padding: 10px 12px;
  border: 1px solid var(--border); border-radius: 14px; background: var(--surface);
  line-height: 1.4; font-size: 16px; overflow-y: auto;
}
textarea#input:disabled { opacity: .6; }
#send { min-height: 44px; border-radius: 14px; padding: 0 16px; }
.hint { text-align: center; font-size: .75rem; color: var(--muted); padding: 0 12px 6px; }
@media (max-width: 560px) {
  header h1 { display: none; }
  .bubble { max-width: 94%; }
  .hint { display: none; }
  #newbtn .long { display: none; }
}
@media (min-width: 561px) { #newbtn .short { display: none; } }
@media (prefers-reduced-motion: reduce) { .caret, .dots i, .chip.running .spin { animation: none; } }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Agente 0</h1>
    <div class="thread-wrap">
      <label for="thread" class="sr-only">Conversación</label>
      <select id="thread"></select>
      <div class="tid">hilo <span id="threadid"></span></div>
    </div>
    <button id="newbtn" class="btn" type="button" aria-label="Nueva conversación"><span class="long">Nueva conversación</span><span class="short" aria-hidden="true">+ Nueva</span></button>
    <button id="membtn" class="btn" type="button" aria-expanded="false" aria-controls="memories" aria-label="Recuerdos" title="Recuerdos guardados">🧠</button>
    <button id="setbtn" class="btn" type="button" aria-expanded="false" aria-controls="settings" aria-label="Ajustes" title="Ajustes">&#9881;&#xFE0E;</button>
  </header>
  <section id="settings" aria-label="Ajustes">
    <label for="userid">ID de usuario</label>
    <input id="userid" type="text" autocomplete="off" spellcheck="false" maxlength="64">
    <small>Se usa para separar los recuerdos de cada persona. Se guarda en este navegador.</small>
    <label class="switch"><input id="showtimes" type="checkbox" checked> Mostrar tiempos de respuesta</label>
    <label for="effortsel">Esfuerzo</label>
    <select id="effortsel">
      <option value="auto">Automático</option>
      <option value="bajo">Bajo</option>
      <option value="medio">Medio</option>
      <option value="alto">Alto</option>
    </select>
    <small>Automático: lo decide el asistente según el mensaje. Bajo/medio/alto lo fijan para cada mensaje.</small>
  </section>
  <section id="memories" aria-label="Recuerdos guardados">
    <h2>Recuerdos de <span id="memuser"></span></h2>
    <div id="memlist"></div>
  </section>
  <main id="messages" role="log" aria-live="polite" aria-relevant="additions text" aria-label="Mensajes"></main>
  <form id="composer" autocomplete="off">
    <label for="input" class="sr-only">Mensaje</label>
    <textarea id="input" rows="1" placeholder="Escribe un mensaje…" enterkeyhint="send"></textarea>
    <button id="send" class="btn primary" type="submit">Enviar</button>
  </form>
  <div class="hint">Enter envía · Shift+Enter nueva línea</div>
</div>

<script>
(function () {
  "use strict";

  /* ---------- storage helpers (siempre en try/catch) ---------- */
  function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* ignore */ } }

  /* ---------- markdown seguro ---------- */
  function esc(s) {
    return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  }
  function trimUrl(u) {
    var tail = "";
    var m;
    while ((m = /[.,;:!?)\]]$/.exec(u))) { tail = m[0] + tail; u = u.slice(0, -1); }
    return [u, tail];
  }
  /* MATH-START */
  // Respaldo por si el modelo escribe LaTeX (\( \), \[ \], $$ $$): lo convierte a texto legible con símbolos
  // Unicode, <sup> y <sub>, sin librerías externas. Recibe texto ya escapado (esc) y devuelve HTML.
  var TEX_SYMBOLS = {
    cdot: "·", times: "×", div: "÷", pm: "±", mp: "∓", le: "≤", leq: "≤", ge: "≥", geq: "≥", neq: "≠", ne: "≠",
    approx: "≈", equiv: "≡", sim: "∼", infty: "∞", sum: "Σ", prod: "Π", int: "∫", to: "→", rightarrow: "→",
    leftarrow: "←", Rightarrow: "⇒", Leftrightarrow: "⇔", implies: "⇒", iff: "⇔", ldots: "…", dots: "…",
    cdots: "⋯", in: "∈", notin: "∉", subset: "⊂", subseteq: "⊆", cup: "∪", cap: "∩", forall: "∀", exists: "∃",
    partial: "∂", nabla: "∇", lfloor: "⌊", rfloor: "⌋", lceil: "⌈", rceil: "⌉", mid: "|", lvert: "|", rvert: "|",
    vert: "|", circ: "∘", degree: "°", neg: "¬", land: "∧", lor: "∨", emptyset: "∅", angle: "∠", prime: "′",
    alpha: "α", beta: "β", gamma: "γ", delta: "δ", epsilon: "ε", varepsilon: "ε", zeta: "ζ", eta: "η",
    theta: "θ", iota: "ι", kappa: "κ", lambda: "λ", mu: "μ", nu: "ν", xi: "ξ", pi: "π", rho: "ρ", sigma: "σ",
    tau: "τ", upsilon: "υ", phi: "φ", varphi: "φ", chi: "χ", psi: "ψ", omega: "ω", Gamma: "Γ", Delta: "Δ",
    Theta: "Θ", Lambda: "Λ", Xi: "Ξ", Pi: "Π", Sigma: "Σ", Phi: "Φ", Psi: "Ψ", Omega: "Ω",
    quad: " ", qquad: "  ", mod: " mod ", bmod: " mod ", log: "log", ln: "ln", sin: "sin", cos: "cos",
    tan: "tan", exp: "exp", max: "max", min: "min", lim: "lim", gcd: "mcd"
  };
  function texToHtml(t) {
    var prev;
    t = t.replace(/\\(left|right|big|Big|bigg|Bigg)(?![a-zA-Z])/g, "");
    t = t.replace(/\\[,;:! ]/g, " ").replace(/\\(%|\{|\}|\$|#|&amp;|_)/g, function (m, c) { return c === "_" ? "\u0002" : c; });
    t = t.replace(/\\(?:text|mathrm|mathbf|mathit|mathsf|mathtt|operatorname|boldsymbol)\{([^{}]*)\}/g, "$1");
    do {
      prev = t;
      t = t.replace(/\\[dt]?frac\{([^{}]*)\}\{([^{}]*)\}/g, function (m, a, b) {
        var simple = function (x) { return /^[\w.·′]+$/.test(x); };
        return (simple(a) ? a : "(" + a + ")") + "/" + (simple(b) ? b : "(" + b + ")");
      });
      t = t.replace(/\\binom\{([^{}]*)\}\{([^{}]*)\}/g, "C($1, $2)");
      t = t.replace(/\\sqrt\[([^\]]*)\]\{([^{}]*)\}/g, "<sup>$1</sup>√($2)");
      t = t.replace(/\\sqrt\{([^{}]*)\}/g, function (m, a) { return /^\w+$/.test(a) ? "√" + a : "√(" + a + ")"; });
      t = t.replace(/\\pmod\{([^{}]*)\}/g, " (mod $1)");
      t = t.replace(/\^\{([^{}]*)\}/g, "<sup>$1</sup>").replace(/_\{([^{}]*)\}/g, "<sub>$1</sub>");
    } while (t !== prev);
    t = t.replace(/\\([a-zA-Z]+)/g, function (m, name) { return TEX_SYMBOLS.hasOwnProperty(name) ? TEX_SYMBOLS[name] : name; });
    t = t.replace(/\^(\\?[\w′]|[+\-])/g, "<sup>$1</sup>").replace(/_([\w])/g, "<sub>$1</sub>");
    t = t.replace(/[{}]/g, "").replace(/\u0002/g, "_").replace(/\s{2,}/g, " ");
    return t.trim();
  }
  function replaceMath(s, keep) {
    s = s.replace(/\$\$([^$]+?)\$\$|\\\[(.+?)\\\]/g, function (m, a, b) {
      return keep('<span class="math block">' + texToHtml(a !== undefined ? a : b) + "</span>");
    });
    return s.replace(/\\\((.+?)\\\)/g, function (m, a) { return keep('<span class="math">' + texToHtml(a) + "</span>"); });
  }
  /* MATH-END */
  function inline(s, noLinks) {
    var stash = [];
    function keep(html) { stash.push(html); return "\u0001" + (stash.length - 1) + "\u0001"; }
    s = s.replace(/[\u0000\u0001]/g, "");
    s = s.replace(/`([^`\n]+)`/g, function (m, c) { return keep("<code>" + c + "</code>"); });
    s = replaceMath(s, keep);
    if (!noLinks) {
      s = s.replace(/\[([^\]\n]+)\]\((https?:\/\/[^\s)]+)\)/g, function (m, t, u) {
        return keep('<a href="' + u + '" target="_blank" rel="noopener noreferrer">' + inline(t, true) + "</a>");
      });
      s = s.replace(/https?:\/\/(?:(?!&lt;|&gt;|&quot;|&#39;)[^\s])+/g, function (m) {
        var p = trimUrl(m);
        return keep('<a href="' + p[0] + '" target="_blank" rel="noopener noreferrer">' + p[0] + "</a>") + p[1];
      });
    }
    s = s.replace(/\*\*([^\n]+?)\*\*/g, "<strong>$1</strong>");
    s = s.replace(/(^|[^\w*])\*([^\s*][^*\n]*?)\*(?![\w*])/g, "$1<em>$2</em>");

    return s;
  }
  function joinDisplayMath(src) {
    return src.split(/(```[\s\S]*?(?:```|$))/).map(function (part, k) {
      if (k % 2) return part;
      return part.replace(/\\\[([\s\S]+?)\\\]|\$\$([\s\S]+?)\$\$/g, function (m) { return m.replace(/\s*\n\s*/g, " "); });
    }).join("");
  }
  function renderMarkdown(src) {

    [/^Error: division by zero\.$/, "Error: división entre cero"],
    [/^Error: invalid expression: /, "Error: expresión inválida: "],
    [/^Error: unknown or unavailable time zone: /, "Error: zona horaria desconocida: "]
  ];
  function toolOutputLabel(out) {
    for (var i = 0; i < TOOL_MESSAGES.length; i++) {
      // con $1 o terminada en ": " se conserva el detalle; si no, solo la etiqueta (el resto es instrucción al modelo)
      var label = TOOL_MESSAGES[i][1];
      if (TOOL_MESSAGES[i][0].test(out)) return /\$\d|: $/.test(label) ? out.replace(TOOL_MESSAGES[i][0], label) : label;
    }
    return out.replace(/^\[engine: [^\]]*\]\n?/, "")
              .replace(/\(keyword match, less reliable\)/g, "(coincidencia por palabras, menos confiable)")
              .replace(/^(\[(Research stopped|The researcher's final summary)[^\]]*\]\n?)+/, "[Investigación parcial] ");
  }
  /* TOOL-LABELS-END */
  AssistantBubble.prototype.toolEnd = function (ev) {
    this.hideDots();
    var g = this.group(ev.name);
    if (g.total <= g.done) g.total++;  // tool_end sin tool_start previo
    g.done++;
    if (ev.status === "error") g.errors++;
    if (ev.status === "skipped") g.skipped = (g.skipped || 0) + 1;
    if (ev.engine) g.engine = ev.engine;
    // bigtool: "Available tools: ['acos', 'log2']" -> herramientas encontradas
    var av = /^Available tools:\s*\[(.*)\]/.exec(ev.output || "");
    if (av) {
      g.found = g.found || [];
      av[1].split(",").forEach(function (s) { s = s.trim().replace(/^['"]|['"]$/g, ""); if (s && g.found.indexOf(s) < 0) g.found.push(s); });
    }
    this.paint(g);
    if (ev.output) g.chip.title = toolOutputLabel(String(ev.output)).slice(0, 500);
  };
  // avance del investigador profundo: búsquedas internas mientras trabaja
  AssistantBubble.prototype.progress = function (ev) {
    var g = this.chips.deep_research;
    if (!g) return;
    if (ev.name === "web_search") { g.searches++; g.last = (ev.args && (ev.args.query || ev.args.consulta)) || ""; }
    this.paint(g);
  };
  // la conversación anterior se resumió (MEMORY_SUMMARIZE)
  AssistantBubble.prototype.summarized = function () {
    var chip = el("div", "chip done");
    chip.appendChild(el("span", "lbl", "🗜️ Conversación anterior resumida"));
    chip.title = "Los mensajes viejos se reemplazaron por un resumen; los datos clave se guardan aparte como recuerdos.";
    this.bubble.insertBefore(chip, this.bubble.firstChild);
  };
  // ANSWER_VERIFY: "ok" deja una nota; "corrected" reemplaza la respuesta y deja ver la original (nunca en silencio)
  AssistantBubble.prototype.verify = function (ev) {
    this.hideDots(); this.closeSeg();
    if (typeof ev.text !== "string") {  // el texto no cambió
      var notes = ev.notes || [];
      this.bubble.appendChild(el("div", "vnote" + (notes.length ? " corrected" : ""),
        ev.status === "ok" && !notes.length ? "✔ Verificada contra las fuentes consultadas" : "⚠️ " + notes.join(" · ")));
      return;
    }
    var segs = this.bubble.querySelectorAll(".seg"), last = segs[segs.length - 1];
    if (!last) { last = el("div", "seg"); this.bubble.appendChild(last); }
    last.innerHTML = renderMarkdown(ev.text);
    this.bubble.appendChild(correctionNote(ev.original, ev));
    scrollDown(false);
  };
  AssistantBubble.prototype.error = function (msg) {
    this.hideDots(); this.closeSeg();
    this.bubble.classList.add("err");
    var p = el("p", "errmsg", "⚠️ " + msg);
    p.setAttribute("role", "alert");
    this.bubble.appendChild(p);
    scrollDown(true);
  };
  AssistantBubble.prototype.mark = function (ev) {
    var t = performance.now() - this.t0;
    this.tev.push({ t: t, type: ev.type, name: ev.type === "phase" ? ev.phase : ev.name });
    if (ev.type === "tool_start") this.running.push(ev.name);
    else if (ev.type === "tool_end") { var i = this.running.indexOf(ev.name); if (i >= 0) this.running.splice(i, 1); }
    else if (ev.type === "token") this.lastTok = t;
    else if (ev.type === "phase") this.verifying = ev.phase === "verifying";
    else if (ev.type === "verify") this.verifying = false;
  };
  AssistantBubble.prototype.liveTime = function () {
    var t = performance.now() - this.t0, phase;
    if (this.running.length) phase = (TOOL_LABELS[this.running[this.running.length - 1]] || "usando herramientas…");
    else if (this.verifying) phase = "verificando…";
    else if (t - this.lastTok < 1500) phase = "escribiendo…";
    else phase = "pensando…";
    this.timing.textContent = "⏱ " + secs(t) + " · " + phase;
  };
  AssistantBubble.prototype.stopTiming = function () {
    if (!this.tick) return;
    clearInterval(this.tick); this.tick = 0;
    var b = computeBreakdown(this.tev, performance.now() - this.t0), parts = [];
    if (b.classify) parts.push("clasificar esfuerzo " + secs(b.classify));
    parts.push("pensando " + secs(b.thinking));
    if (b.tools) parts.push("herramientas " + secs(b.tools));
    if (b.verify) parts.push("verificación " + secs(b.verify));
    if (b.summary) parts.push("resumen " + secs(b.summary));
    this.timing.textContent = "";
    var head = "⏱ " + secs(b.total) + (this.effortText ? " · " + this.effortText : "");
    this.timing.appendChild(document.createTextNode(head));
    this.timing.appendChild(el("span", "tdetail", " · " + parts.join(" · ")));
    this.timing.title = (this.effortText ? this.effortText + "\n" : "") + parts.join("\n");
    this.timing.setAttribute("aria-label", "Tiempo de respuesta " + head.slice(2) + ": " + parts.join(", "));
  };
  AssistantBubble.prototype.finish = function () {
    this.stopTiming();
    this.live = false; this.hideDots();
    if (this.seg) { this.closeSeg(); }
    // marca como abortados los chips que sigan "en curso"
    var spinning = this.bubble.querySelectorAll(".chip.running");
    Array.prototype.forEach.call(spinning, function (c) { c.classList.remove("running"); var s = c.querySelector(".spin"); if (s) s.remove(); });
    if (!this.bubble.children.length) this.row.remove();
  };
  AssistantBubble.prototype.approval = function (ev, onDecide) {
    this.hideDots(); this.closeSeg();
    var card = el("div", "approval");
    card.setAttribute("role", "group");
    card.setAttribute("aria-label", "Aprobación requerida");
    card.appendChild(el("h3", null, "✋ Se requiere tu aprobación"));
    var acts = ev.action_requests || [];
    acts.forEach(function (a) {
      var box = el("div", "act");
      var name = canonicalTool(String(a.name || ""));
      box.appendChild(el("b", null, TOOL_DONE[name] || a.name || "acción"));
      if (a.description) box.appendChild(el("p", null, a.description));
      if (name === "deep_research") {  // confirmación de investigación: se muestra el encargo, no JSON
        if (a.args && a.args.task) box.appendChild(el("p", "task", "Encargo: " + a.args.task));
      } else {
        var pre = el("pre");
        try { pre.textContent = JSON.stringify(a.args || {}, null, 2); } catch (e) { pre.textContent = String(a.args); }
        box.appendChild(pre);
      }
      card.appendChild(box);
    });
    var btns = el("div", "btns");
    var research = acts.length === 1 && canonicalTool(String(acts[0].name || "")) === "deep_research";
    var ok = el("button", "btn primary", research ? "Sí, investiga" : "Aprobar"); ok.type = "button";
    var no = el("button", "btn danger", research ? "No, responde sin investigar" : "Rechazar"); no.type = "button";
    btns.appendChild(ok); btns.appendChild(no); card.appendChild(btns);
    var self = this, decided = false;
    function decide(approve) {
      if (decided) return; decided = true;
      ok.disabled = true; no.disabled = true;
      btns.remove();
      var r = el("div", "result", research ? (approve ? "✓ Investigando…" : "✗ Sin investigación a fondo")
                                            : (approve ? "✓ Aprobado" : "✗ Rechazado"));
      card.appendChild(r);
      var n = acts.length || 1, decisions = [];
      for (var k = 0; k < n; k++) decisions.push(approve ? { type: "approve" } : { type: "reject", message: REJECT_MSG });
      onDecide(decisions);
    }
    ok.addEventListener("click", function () { decide(true); });
    no.addEventListener("click", function () { decide(false); });
    this.bubble.appendChild(card);
    scrollDown(true);
    ok.focus({ preventScroll: true });
  };

  /* ---------- SSE sobre fetch ---------- */
  async function streamSSE(url, body, bubble, handlers) {
    var resp;
    try {
      resp = await fetch(url, {
        method: "POST",
        headers: { "Content-Type": "application/json", "Accept": "text/event-stream" },
        body: JSON.stringify(body)
      });
    } catch (e) {
      bubble.error("No pude conectar con el servidor. " + (e && e.message ? e.message : ""));
      return;
    }
    if (!resp.ok) {
      var detail = "";
      try { detail = (await resp.text()).slice(0, 300); } catch (e) { /* ignore */ }
      bubble.error("Error del servidor (" + resp.status + ")" + (detail ? ": " + detail : ""));
      return;
    }
    if (!resp.body || !resp.body.getReader) {
      bubble.error("Este navegador no permite leer respuestas en streaming.");
      return;
    }
    var reader = resp.body.getReader(), dec = new TextDecoder("utf-8"), buf = "";
    function handleBlock(block) {
      var data = [];
      block.split("\n").forEach(function (ln) {
        if (ln.indexOf("data:") === 0) data.push(ln.slice(ln.charAt(5) === " " ? 6 : 5));
      });
      if (!data.length) return;
      var ev;
      try { ev = JSON.parse(data.join("\n")); } catch (e) { return; }
      if (ev && ev.type) handlers(ev);
    }
    try {
      for (;;) {
        var r = await reader.read();
        if (r.done) break;
        buf += dec.decode(r.value, { stream: true });
        buf = buf.replace(/\r\n/g, "\n");
        var idx;
        while ((idx = buf.indexOf("\n\n")) >= 0) {
          handleBlock(buf.slice(0, idx));
          buf = buf.slice(idx + 2);
        }
      }
      buf += dec.decode();
      buf = buf.replace(/\r\n/g, "\n");
      if (buf.trim()) handleBlock(buf);
    } catch (e) {
      bubble.error("Se interrumpió la conexión. " + (e && e.message ? e.message : ""));
    }
  }

  async function runTurn(path, body, bubble) {
    state.streaming = true; bubble.live = true; updateControls();
    var gotDone = false, interrupted = false;
    await streamSSE(path, body, bubble, function (ev) {
      if (ev.name) ev.name = canonicalTool(ev.name);
      bubble.mark(ev);
      switch (ev.type) {
        case "token": if (typeof ev.text === "string") bubble.token(ev.text); break;
        case "effort": bubble.effort(ev); break;
        case "tool_start": bubble.toolStart(ev); break;
        case "tool_end": bubble.toolEnd(ev); break;
        case "progress": bubble.progress(ev); break;
        case "summarized": bubble.summarized(); break;
        case "verify": bubble.verify(ev); break;
        case "interrupt":
          interrupted = true;
          state.pending++; updateControls();
          bubble.approval(ev, function (decisions) {
            state.pending--;
            runTurn("/resume", { thread_id: body.thread_id, user_id: body.user_id, decisions: decisions }, bubble);
          });
          break;
        case "error": bubble.error(ev.message || "Error desconocido"); break;
        case "done": gotDone = true; break;
      }
    });
    state.streaming = false;
    if (memEl.classList.contains("open")) loadMemories();  // por si guardó un recuerdo en este turno
    if (!state.pending) bubble.finish(); else bubble.live = false;
    if (state.newQueued) { bubble.finish(); openNewThread(); return; }  // clic en "Nueva conversación" durante el turno
    updateControls();
    if (!inputEl.disabled) inputEl.focus({ preventScroll: true });
    scrollDown(false);
  }

  /* ---------- enviar ---------- */
  function send(text) {
    text = (text || "").trim();
    if (!text || state.streaming || state.pending) return;
    addUserBubble(text);
    touchThread(state.threadId, text);
    inputEl.value = ""; autosize();
    var bubble = new AssistantBubble();
    scrollDown(true);
    var effort = effortEl.value === "auto" ? null : effortEl.value;  // el selector manda sobre el clasificador
    runTurn("/chat", { message: text, thread_id: state.threadId, user_id: userId(), effort: effort }, bubble);
  }

  /* ---------- historial ---------- */
  async function loadHistory(id) {
    var seq = ++state.loadSeq;
    clearMessages();
    var loading = el("div", "sys", "Cargando conversación…");
    messagesEl.appendChild(loading);
    var data = null;
    try {
      var r = await fetch("/history/" + encodeURIComponent(id));
      if (r.ok) data = await r.json();
    } catch (e) { /* ignore */ }
    if (seq !== state.loadSeq) return;
    clearMessages();
    var msgs = data && Array.isArray(data.messages) ? data.messages : null;
    if (!msgs) { showEmpty(); if (data === null) { messagesEl.appendChild(el("div", "sys", "No pude cargar el historial.")); } return; }
    if (!msgs.length) { showEmpty(); return; }
    var firstUser = "";
    msgs.forEach(function (m) {
      if (m.role === "user") { if (!firstUser) firstUser = String(m.content || ""); addUserBubble(String(m.content || "")); }
      else if (m.role === "assistant") addAssistantStatic(String(m.content || ""), m.original, m.verify);
      else if (m.role === "tool") addToolLine(canonicalTool(String(m.name || "herramienta")), m.status);
      else if (m.role === "summary") messagesEl.appendChild(el("div", "sys", "🗜️ La conversación anterior se resumió; aquí se ven los mensajes conservados."));
    });
    setTitleIfMissing(id, firstUser);
    scrollDown(true);
  }

  /* ---------- recuerdos ---------- */
  var CONF = { verified: "✔ verificado", quoted: "❝ con cita", unverified: "sin verificar" };
  var memSeq = 0;
  async function loadMemories() {
    var seq = ++memSeq, uid = userId();
    $("memuser").textContent = uid;
    memListEl.textContent = "";
    memListEl.appendChild(el("p", "sys", "Cargando…"));
    var data = null;
    try {
      var r = await fetch("/memories/" + encodeURIComponent(uid));
      if (r.ok) data = await r.json();
    } catch (e) { /* ignore */ }
    if (seq !== memSeq) return;
    memListEl.textContent = "";
    if (!data) { memListEl.appendChild(el("p", "sys", "No pude cargar los recuerdos.")); return; }
    if (!data.memories.length) { memListEl.appendChild(el("p", "sys", "Sin recuerdos guardados para este usuario.")); return; }
    var ul = el("ul");
    data.memories.forEach(function (m) {
      var li = el("li"), txt = el("div", "mtext", m.text), meta = el("span", "mmeta");
      var when = "";
      try { when = m.created_at ? new Date(m.created_at).toLocaleString() : ""; } catch (e) { /* ignore */ }
      if (when) meta.appendChild(document.createTextNode(when + " · "));
      meta.appendChild(el("span", "conf " + m.confidence, CONF[m.confidence] || m.confidence));
      meta.appendChild(document.createTextNode(" · "));
      if (m.evidence) { meta.appendChild(document.createTextNode("evidencia: ")); meta.appendChild(el("q", null, m.evidence)); }
      else meta.appendChild(document.createTextNode("sin evidencia"));
      txt.appendChild(meta);
      if (m.previous_text) {  // actualizado por el agente: valor anterior para auditar/deshacer
        var prev = el("span", "mmeta");
        var up = "";
        try { up = m.updated_at ? new Date(m.updated_at).toLocaleString() : ""; } catch (e) { /* ignore */ }
        prev.appendChild(document.createTextNode("✏️ actualizado" + (up ? " " + up : "") + " · antes: "));
        prev.appendChild(el("q", null, m.previous_text));
        txt.appendChild(prev);
      }
      var del = el("button", "btn danger", "🗑"); del.type = "button";
      del.setAttribute("aria-label", "Borrar recuerdo: " + m.text); del.title = "Borrar";
      del.addEventListener("click", async function () {
        if (!confirm("¿Borrar este recuerdo?\n\n" + m.text)) return;
        del.disabled = true;
        try { await fetch("/memories/" + encodeURIComponent(uid) + "/" + encodeURIComponent(m.key), { method: "DELETE" }); } catch (e) { /* ignore */ }
        loadMemories();
      });
      li.appendChild(txt); li.appendChild(del); ul.appendChild(li);
    });
    memListEl.appendChild(ul);
  }

  function openNewThread() {
    // una aprobación pendiente se abandona (el hilo anterior queda en pausa); el turno en curso ya terminó
    state.newQueued = false; state.pending = 0;
    switchThread(newId(), true);
    updateControls();
  }
  function requestNewThread() {
    if (state.streaming) { state.newQueued = !state.newQueued; updateControls(); return; }  // 2º clic: cancela
    openNewThread();
  }
  function showThreadId() { $("threadid").textContent = state.threadId || ""; }

  function switchThread(id, isNew) {
    state.threadId = id;
    showThreadId();
    lsSet("currentThread", id);
    setUrlThread(id);
    if (isNew) touchThread(id, ""); else renderThreadSelect();
    if (isNew) { state.loadSeq++; showEmpty(); } else loadHistory(id);
    inputEl.focus({ preventScroll: true });
  }

  /* ---------- eventos ---------- */
  document.getElementById("composer").addEventListener("submit", function (e) { e.preventDefault(); send(inputEl.value); });
  inputEl.addEventListener("keydown", function (e) {
    if (e.key === "Enter" && !e.shiftKey && !e.isComposing && e.keyCode !== 229) { e.preventDefault(); send(inputEl.value); }
  });
  inputEl.addEventListener("input", autosize);
  newBtn.addEventListener("click", requestNewThread);
  threadSel.addEventListener("change", function () { if (threadSel.value) switchThread(threadSel.value, false); });
  setBtn.addEventListener("click", function () {
    var open = settingsEl.classList.toggle("open");
    setBtn.setAttribute("aria-expanded", open ? "true" : "false");
    if (open) userEl.focus();
  });
  memBtn.addEventListener("click", function () {
    var open = memEl.classList.toggle("open");
    memBtn.setAttribute("aria-expanded", open ? "true" : "false");
    if (open) loadMemories();
  });
  userEl.addEventListener("change", function () { if (memEl.classList.contains("open")) loadMemories(); });
  userEl.addEventListener("input", function () { state.userId = userEl.value; lsSet("userId", userEl.value.trim() || "usuario"); });
  userEl.addEventListener("blur", function () { if (!userEl.value.trim()) userEl.value = "usuario"; state.userId = userEl.value; });

  /* ---------- init ---------- */
  timesEl.checked = lsGet("showTimes") !== "0";  // encendido por defecto
  document.body.classList.toggle("no-times", !timesEl.checked);
  timesEl.addEventListener("change", function () {
    document.body.classList.toggle("no-times", !timesEl.checked);
    lsSet("showTimes", timesEl.checked ? "1" : "0");
  });
  var savedEffort = lsGet("effort");
  if (["auto", "bajo", "medio", "alto"].indexOf(savedEffort) >= 0) effortEl.value = savedEffort;
  effortEl.addEventListener("change", function () { lsSet("effort", effortEl.value); });
  state.userId = lsGet("userId") || "usuario";
  userEl.value = state.userId;
  state.threads = loadThreads();
  var urlThread = null;
  try { urlThread = new URL(location.href).searchParams.get("thread"); } catch (e) { /* ignore */ }
  if (urlThread && !/^[\w.-]{1,64}$/.test(urlThread)) urlThread = null;
  var startId = urlThread || lsGet("currentThread") || (state.threads[0] && state.threads[0].id) || null;
  var fresh = false;
  if (!startId) { startId = newId(); fresh = true; }
  state.threadId = startId;
  showThreadId();
  lsSet("currentThread", startId);
  setUrlThread(startId);
  var known = state.threads.some(function (t) { return t.id === startId; });
  if (!known) { state.threads.unshift({ id: startId, title: "" }); saveThreads(); }
  renderThreadSelect();
  updateControls();
  if (fresh) showEmpty(); else loadHistory(startId);
  autosize();
})();
</script>
</body>
