[project]
name = "assistant"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    # Rangos: desde la versión probada hasta la siguiente mayor (en las 0.x jóvenes, la siguiente menor). Las
    # versiones exactas están en uv.lock: `uv sync --extra dev` reproduce el entorno de la suite.
    # langgraph: tope en <1.3 (no <2): el cierre de turno en bigtool usa una constante interna de langgraph
    "langgraph>=1.2.15,<1.3",
    "langchain>=1.4.6,<2",
    "langchain-core>=1.6.10,<2",      # se importa directamente (mensajes, herramientas, callbacks)
    "langchain-openai>=1.7.2,<2",
    "langgraph-checkpoint-mongodb>=0.5.1,<0.6",
    # store: con índice vectorial, put(index=False) lanza IndexError (por eso los archivos van a file_store)
    "langgraph-store-mongodb>=0.4.0,<0.5",
    "pymongo>=4.19,<5",
    "fastapi>=0.143.1,<1",
    "uvicorn>=0.54,<1",
    "python-dotenv>=1.2,<2",
    "ddgs>=9.16,<10",
    "tiktoken>=0.14,<1",              # se importa directamente (medidor de contexto)
    "tzdata>=2026.5",
    "argon2-cffi>=25.1,<26",  # contraseñas (AUTH_ENABLED)
    # ponytail: desde git y fijado: PyPI 0.0.3 (jun-2025) está roto con langgraph 1.x; el fix está en main sin publicar.
    "langgraph-bigtool @ git+https://github.com/langchain-ai/langgraph-bigtool@fede4439bad7e1b173d731d47728b6e7793a6bf7",
]

[project.optional-dependencies]
# FILES_ENABLED: extracción de PDF, xlsx y docx, imágenes y subida multipart. Solo hacen falta con el interruptor.
files = ["pypdf>=6.21,<7", "openpyxl>=3.1.5,<4", "python-docx>=1.2,<2", "Pillow>=13,<14", "python-multipart>=0.0.32,<0.1"]
# playwright: tests de interfaz con Edge/Chrome ya instalados; se saltan si no hay
dev = ["pytest>=9.1,<10", "httpx>=0.28,<0.29", "playwright>=1.64,<2",
       "pypdf>=6.21,<7", "openpyxl>=3.1.5,<4", "python-docx>=1.2,<2", "Pillow>=13,<14", "python-multipart>=0.0.32,<0.1"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"  # las pruebas del CRM (tests/crm) son async
