[project]
name = "assistant"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=1.2,<1.3",
    "langchain>=1.3.14",
    "langchain-openai",
    "langgraph-checkpoint-mongodb",
    "langgraph-store-mongodb",
    "pymongo",
    "fastapi",
    "uvicorn",
    "python-dotenv",
    "ddgs",
    "tzdata",
    # ponytail: desde git y fijado: PyPI 0.0.3 (jun-2025) está roto con langgraph 1.x; el fix está en main sin publicar.
    "langgraph-bigtool @ git+https://github.com/langchain-ai/langgraph-bigtool@fede4439bad7e1b173d731d47728b6e7793a6bf7",
]

[project.optional-dependencies]
dev = ["pytest", "httpx"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
